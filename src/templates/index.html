<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Задание 1.2 - HTML Страница</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            padding: 60px 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 600px;
        }
        
        h1 {
            color: #667eea;
            font-size: 2.5em;
            margin-bottom: 30px;
            font-weight: 700;
        }
        
        p {
            color: #333;
            font-size: 1.3em;
            line-height: 1.6;
            margin-bottom: 20px;
        }
        
        .emoji {
            font-size: 4em;
            margin: 30px 0;
        }
        
        .info {
            background: #f0f4ff;
            padding: 20px;
            border-radius: 10px;
            margin-top: 30px;
            color: #555;
            font-size: 0.95em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Задание 1.2</h1>
        <div class="emoji">😊</div>
        <p>Я ОБОЖАЮ ВСТАВАТЬ К ПЕРВОЙ ПАРЕ :)</p>
        <div class="info">
            <p><strong>Маршрут:</strong> GET /html</p>
            <p><strong>Описание:</strong> HTML страница с текстом</p>
        </div>
    </div>
</body>
</html>
